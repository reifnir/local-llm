# Curated local models for this machine:
#   RTX 5080 16 GB (~13.3 GB free while the Windows desktop is running)
#   Ryzen 7 9800X3D (8C/16T), 64 GB DDR5 (48 GB visible to WSL via .wslconfig)
#
# ── Integrity ──────────────────────────────────────────────────────────────────
# Every file is pinned twice: to a Hugging Face commit (`revision`) and to its sha256
# (the `[model.files]` table). `make install` streams each download through sha256 and
# refuses anything that does not match; `make use` re-checks before serving.
# The only thing that changes a pin is `make accept MODEL=<id>`, which shows the upstream
# diff and rewrites `revision` + `[model.files]` for that one model after you confirm.
#
# ── safety ─────────────────────────────────────────────────────────────────────
#   A  original vendor weights, packaged by the vendor or by ggml-org (llama.cpp maintainers)
#   B  original weights re-quantized by an established third party (unsloth), or a
#      reputable fine-tune (ThinkingCap / bottlecapai): you are trusting that party's weights
#   C  abliterated: a third party deliberately removed refusal behaviour. No guardrails, and it
#      will follow instructions injected via files, web pages or issues without pushback, so
#      do not give it shell/tool access over untrusted input
# All weights are data-only formats (GGUF / safetensors). Pickle formats (.bin/.pt/.pth/.ckpt)
# and repository code (.py) are refused by scripts/models.py regardless of what is listed here.
#
# ── placement (LLMs, served by llama.cpp) ─────────────────────────────────────
#   gpu    every layer on the GPU; context is grown automatically to fill the VRAM that is left
#          (`ctx` is the minimum: startup fails rather than spilling to system RAM)
#   split  fixed `ctx`; llama.cpp --fit keeps attention/dense weights on the GPU and moves MoE
#          expert tensors (or whole layers, for dense models) into system RAM until it fits.
#          Cheap for MoE (~3B active params per token), noticeably slower for dense models.
#
# ── claude_code (wiring a served model into Claude Code: `make claude`) ───────
#   yes      works through llama-server's Anthropic Messages endpoint with tool calls
#   limited  works, but the context that fits is small next to Claude Code's 15-30K-token base
#            prompt (more with MCP servers / CLAUDE.md), so sessions compact early and often
#   no       cannot be wired up: not a chat model
# Anthropic does not support or test Claude Code with non-Claude models; agent quality depends on
# the model. Only entries marked "tested" in their note have been run end to end.
#
# Sizes are file sizes; the KV cache and compute buffers need roughly 1-3 GB on top.

[settings]
default_llm = "qwen3.6-35b-a3b"   # used by `make up` before any `make use`
fit_margin_mib = 1024             # VRAM llama.cpp leaves free (Windows desktop, browser, etc.)
threads = 8                       # physical cores; matters when MoE experts run on the CPU
kv_cache_type = "q8_0"            # halves KV-cache VRAM vs f16 at negligible quality cost

